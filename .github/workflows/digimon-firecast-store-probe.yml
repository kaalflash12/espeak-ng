name: DIGIMON Firecast Store Probe

on:
  push:
    branches: [digimon-ci-temp-20260830]
    paths: [.github/workflows/digimon-firecast-store-probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Install and map Firecast from Microsoft Store
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Write-Host '=== STORE INSTALL ==='
          & winget install --id XP9B1DQSFR12KZ --source msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
          $installExit=$LASTEXITCODE
          Write-Host "STORE_INSTALL_EXIT=$installExit"
          if($installExit-ne0){throw "Store install failed $installExit"}

          $firecast=Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe'
          if(-not(Test-Path $firecast)){throw 'Firecast.exe missing after Store install'}
          $vi=[Diagnostics.FileVersionInfo]::GetVersionInfo($firecast)
          Write-Host "FIRECAST_EXE=$firecast"
          Write-Host "FIRECAST_FILE_VERSION=$($vi.FileVersion) PRODUCT_VERSION=$($vi.ProductVersion) PRODUCT=$($vi.ProductName)"
          Write-Host ('FIRECAST_SHA256='+(Get-FileHash $firecast -Algorithm SHA256).Hash.ToLowerInvariant())

          Write-Host '=== FIRECAST EXE TREE ==='
          Get-ChildItem (Split-Path $firecast) -Recurse -File -Filter '*.exe' -ErrorAction SilentlyContinue | ForEach-Object {
            $v=$_.VersionInfo
            Write-Host ("EXE="+$_.FullName+" FILE_VERSION="+$v.FileVersion+" PRODUCT="+$v.ProductName)
          }

          Write-Host '=== RPK EXTENSION ==='
          cmd /c 'reg query HKCU\Software\Classes\.rpk /s' 2>&1 | Write-Host
          Write-Host '=== RPK PROGID ==='
          cmd /c 'reg query HKCU\Software\Classes\firecast.rpk.installer /s' 2>&1 | Write-Host
          Write-Host '=== RPK PROGID HKCR ==='
          cmd /c 'reg query HKCR\firecast.rpk.installer /s' 2>&1 | Write-Host

          $cmd=(Get-ItemProperty 'Registry::HKEY_CURRENT_USER\Software\Classes\firecast.rpk.installer\shell\open\command' -ErrorAction Stop).'(default)'
          Write-Host "RPK_OPEN_COMMAND=$cmd"
          if([string]::IsNullOrWhiteSpace($cmd)){throw 'RPK open command missing'}
          Write-Host 'FIRECAST_RPK_ASSOCIATION=PASS'
