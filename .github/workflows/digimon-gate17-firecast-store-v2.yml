name: DIGIMON Gate17 Firecast Store Runtime V2
on:
  push:
    branches: [digimon-ci-temp-20260830]
  workflow_dispatch:

jobs:
  gate17:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Firecast and prepare exact harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          winget install --id XP9B1DQSFR12KZ --source msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
          if($LASTEXITCODE -ne 0){throw "Firecast install failed: $LASTEXITCODE"}
          $firecast=Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe'
          if(!(Test-Path $firecast)){throw 'Firecast.exe missing'}
          Write-Host "FIRECAST_SHA256=$((Get-FileHash $firecast -Algorithm SHA256).Hash.ToLowerInvariant())"
          $work=Join-Path $env:RUNNER_TEMP 'digimon-g17-store-v2'; New-Item -ItemType Directory -Force $work|Out-Null
          $bundle=Join-Path $work 'bundle.zip'
          python -m pip install --quiet gdown
          python -m gdown 'https://drive.google.com/uc?id=1LWaYGuvoVLQ-TP3Yj0nqVprosbmYe_1b' -O $bundle
          if($LASTEXITCODE -ne 0){throw 'gdown failed'}
          $bh=(Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant(); Write-Host "BUNDLE_SHA256=$bh"
          if($bh-ne'42094ab528b6f2139b0f2b09ef6741fb3a5640b5ba0f45041270c9e1f3d70bdb'){throw 'bundle hash mismatch'}
          $unpack=Join-Path $work 'bundle'; Expand-Archive $bundle $unpack -Force
          $final=Join-Path $unpack 'DIGIMON_ERA_DA_DUALIDADE_FINAL.rpk'
          $rh=(Get-FileHash $final -Algorithm SHA256).Hash.ToLowerInvariant(); Write-Host "FINAL_RPK_SHA256=$rh"
          if($rh-ne'3a3a61e642054f7a98cc7eefb01f0d43c8acf7c703e262b8bb55e8b63682bfef'){throw 'RPK hash mismatch'}
          $zip=Join-Path $work 'final.zip'; Copy-Item $final $zip
          $tree=Join-Path $work 'tree'; Expand-Archive $zip $tree -Force
          Copy-Item '${{ github.workspace }}\ci\digimon-gate17\gate17_init_store.lua' (Join-Path $tree 'init.lua') -Force
          $hz=Join-Path $work 'harness.zip'; Compress-Archive -Path (Join-Path $tree '*') -DestinationPath $hz -CompressionLevel Optimal
          $harness=Join-Path $work 'DIGIMON_GATE17_STORE_HARNESS.rpk'; Move-Item $hz $harness -Force
          Write-Host "HARNESS_SHA256=$((Get-FileHash $harness -Algorithm SHA256).Hash.ToLowerInvariant())"
          "FINAL_RPK=$final"|Out-File $env:GITHUB_ENV -Append
          "HARNESS_RPK=$harness"|Out-File $env:GITHUB_ENV -Append

      - name: Gate17 real persistence across fresh process
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $firecast=Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe'
          function Get-Names([int]$processId){
            $root=[Windows.Automation.AutomationElement]::RootElement
            $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
            $o=New-Object System.Collections.Generic.List[string]
            foreach($e in $all){try{if($e.Current.ProcessId-eq$processId -and -not [string]::IsNullOrWhiteSpace([string]$e.Current.Name)){$o.Add([string]$e.Current.Name)}}catch{}}
            return $o
          }
          function Invoke-Affirmative([int]$processId){
            $root=[Windows.Automation.AutomationElement]::RootElement
            $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
            foreach($e in $all){try{if($e.Current.ProcessId-ne$processId){continue};$n=([string]$e.Current.Name).Trim();if($n-match'^(Instalar|Install|Sim|Yes|OK|Continuar|Continue|Atualizar|Update)$'){$ip=$e.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern);if($ip){Write-Host "INVOKE_BUTTON=$n";$ip.Invoke();Start-Sleep -Milliseconds 800;return $true}}}catch{}}
            return $false
          }
          function Wait-Marker([int]$processId,[string]$pattern,[int]$seconds){
            $deadline=(Get-Date).AddSeconds($seconds)
            while((Get-Date)-lt$deadline){
              if(!(Get-Process -Id $processId -ErrorAction SilentlyContinue)){return 'PROCESS_EXITED'}
              $names=Get-Names $processId
              foreach($n in $names){if($n-match$pattern){return $n}}
              [void](Invoke-Affirmative $processId)
              Start-Sleep 2
            }
            return 'TIMEOUT'
          }
          function Close-Gracefully([System.Diagnostics.Process]$proc){
            if($proc.HasExited){throw 'process exited before graceful close'}
            $root=[Windows.Automation.AutomationElement]::RootElement
            $wins=$root.FindAll([Windows.Automation.TreeScope]::Children,[Windows.Automation.Condition]::TrueCondition)
            foreach($w in $wins){try{if($w.Current.ProcessId-eq$proc.Id){try{$wp=$w.GetCurrentPattern([Windows.Automation.WindowPattern]::Pattern);if($wp){$wp.Close();Start-Sleep 1}}catch{}}}catch{}}
            if(!$proc.HasExited){[void]$proc.CloseMainWindow()}
            if(!$proc.WaitForExit(30000)){throw 'GRACEFUL_CLOSE_TIMEOUT'}
            Write-Host "GRACEFUL_CLOSE_EXIT=$($proc.ExitCode)"
          }
          Get-Process Firecast -ErrorAction SilentlyContinue|Stop-Process -Force
          Start-Sleep 2
          $p1=Start-Process $firecast -ArgumentList @($env:HARNESS_RPK) -PassThru
          Start-Sleep 5
          Write-Host "PHASE1_PROCESS_ID=$($p1.Id)"
          $m1=Wait-Marker $p1.Id 'GATE17_(PHASE1_PASS|PHASE1_FAIL|NDB_OPEN_FAIL)' 180
          Write-Host "GATE17_PHASE1_MARKER=$m1"
          if($m1-notmatch'GATE17_PHASE1_PASS'){
            Get-Names $p1.Id|Select-Object -Unique|Select-Object -First 250|ForEach-Object{Write-Host "UI=$_"}
            throw "Phase1 not PASS: $m1"
          }
          [void](Invoke-Affirmative $p1.Id); Start-Sleep 1
          Close-Gracefully $p1
          Write-Host 'GATE17_PHASE1_GRACEFUL_CLOSE=1'
          Start-Sleep 3
          $p2=Start-Process $firecast -PassThru
          Start-Sleep 3
          Write-Host "PHASE2_PROCESS_ID=$($p2.Id)"
          $m2=Wait-Marker $p2.Id 'GATE17_(PHASE2_PASS|PHASE2_FAIL|NDB_OPEN_FAIL)' 180
          Write-Host "GATE17_PHASE2_MARKER=$m2"
          if($m2-notmatch'GATE17_PHASE2_PASS'){
            Get-Names $p2.Id|Select-Object -Unique|Select-Object -First 250|ForEach-Object{Write-Host "UI=$_"}
            throw "Phase2 not PASS: $m2"
          }
          [void](Invoke-Affirmative $p2.Id); Start-Sleep 1
          Close-Gracefully $p2
          Write-Host 'GATE17_PHASE2_GRACEFUL_CLOSE=1'
          Write-Host 'GATE17=PASS'

      - name: Restore exact final RPK and Gate18
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $firecast=Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe'
          function Invoke-Affirmative([int]$processId){
            $root=[Windows.Automation.AutomationElement]::RootElement
            $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
            foreach($e in $all){try{if($e.Current.ProcessId-ne$processId){continue};$n=([string]$e.Current.Name).Trim();if($n-match'^(Instalar|Install|Sim|Yes|OK|Continuar|Continue|Atualizar|Update)$'){$ip=$e.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern);if($ip){$ip.Invoke();Start-Sleep 1;return $true}}}catch{}}
            return $false
          }
          Get-Process Firecast -ErrorAction SilentlyContinue|Stop-Process -Force
          $p=Start-Process $firecast -ArgumentList @($env:FINAL_RPK) -PassThru
          for($i=0;$i-lt25;$i++){if($p.HasExited){throw 'Firecast exited during final RPK restore'};[void](Invoke-Affirmative $p.Id);Start-Sleep 1}
          $root=[Windows.Automation.AutomationElement]::RootElement
          $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
          foreach($e in $all){try{if($e.Current.ProcessId-eq$p.Id -and ([string]$e.Current.Name)-match'^Error$|stack traceback|runtime error'){throw "Final runtime error: $($e.Current.Name)"}}catch{if($_.Exception.Message-match'Final runtime error'){throw}}}
          Write-Host 'GATE18_FINAL_ERROR=0'
          Write-Host 'GATE18_FINAL_PROCESS_ALIVE=1'
          Write-Host 'GATE18=PASS'
          Write-Host 'OVERALL_18_OF_18=PASS'
          try{[void]$p.CloseMainWindow();[void]$p.WaitForExit(15000)}catch{}
