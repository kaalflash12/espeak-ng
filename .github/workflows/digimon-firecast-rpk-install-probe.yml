name: DIGIMON Firecast RPK Install Probe

on:
  push:
    branches: [digimon-ci-temp-20260830]
    paths: [.github/workflows/digimon-firecast-rpk-install-probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Require DigiTerion canary execution from Firecast plugin folder
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          winget install --id XP9B1DQSFR12KZ --source msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
          if($LASTEXITCODE-ne0){throw "Firecast Store install failed $LASTEXITCODE"}
          $firecast=Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe'
          if(-not(Test-Path $firecast)){throw 'Firecast.exe missing'}

          python -m pip install --disable-pip-version-check --quiet gdown
          $bundle=Join-Path $env:RUNNER_TEMP 'bundle.zip'
          python -m gdown 'https://drive.google.com/uc?id=1LWaYGuvoVLQ-TP3Yj0nqVprosbmYe_1b' -O $bundle
          $bundleSha=(Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if($bundleSha-ne '42094ab528b6f2139b0f2b09ef6741fb3a5640b5ba0f45041270c9e1f3d70bdb'){throw "Bundle SHA mismatch $bundleSha"}
          $runtime=Join-Path $env:RUNNER_TEMP 'bundle'
          Expand-Archive $bundle $runtime -Force
          $finalRpk=Join-Path $runtime 'DIGIMON_ERA_DA_DUALIDADE_FINAL.rpk'
          $rpkSha=(Get-FileHash $finalRpk -Algorithm SHA256).Hash.ToLowerInvariant()
          if($rpkSha-ne '3a3a61e642054f7a98cc7eefb01f0d43c8acf7c703e262b8bb55e8b63682bfef'){throw "RPK SHA mismatch $rpkSha"}
          Write-Host "FINAL_RPK_SHA256=$rpkSha"

          # Initialize profile/default plugins, then close cleanly.
          $p=Start-Process -FilePath $firecast -PassThru
          Start-Sleep 12
          if(-not $p.HasExited){$p.CloseMainWindow()|Out-Null; try{Wait-Process -Id $p.Id -Timeout 8 -ErrorAction Stop}catch{Stop-Process -Id $p.Id -Force}}

          $plugins=Join-Path $env:APPDATA 'Firecast\Plugins'
          New-Item -ItemType Directory -Force $plugins|Out-Null
          $canary=Join-Path $env:RUNNER_TEMP 'DigiTerionMon.EraDaDualidade.canary.rpk'
          $py=Join-Path $env:RUNNER_TEMP 'make-canary.py'
          $pyCode = @(
            'import sys,zipfile',
            'src,dst=sys.argv[1],sys.argv[2]',
            'marker="DIGITERION_DIRECT_PLUGIN_LOAD_CANARY"',
            'with zipfile.ZipFile(src,"r") as zin, zipfile.ZipFile(dst,"w") as zout:',
            '    for info in zin.infolist():',
            '        data=zin.read(info.filename)',
            '        if info.filename=="init.lua":',
            '            data=("showMessage(\\\""+marker+"\\\")\\n").encode("utf-8")',
            '        zout.writestr(info,data)',
            'print(marker)'
          ) -join "`n"
          Set-Content -LiteralPath $py -Value $pyCode -Encoding UTF8
          & python $py $finalRpk $canary
          if($LASTEXITCODE-ne0 -or -not(Test-Path $canary)){throw 'CANARY_RPK_BUILD_FAILED'}
          Write-Host ('CANARY_RPK_SHA256='+(Get-FileHash $canary -Algorithm SHA256).Hash.ToLowerInvariant())
          $dest=Join-Path $plugins 'DigiTerionMon.EraDaDualidade.rpk'
          Copy-Item $canary $dest -Force
          Write-Host "CANARY_PLUGIN_PATH=$dest"

          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $marker='DIGITERION_DIRECT_PLUGIN_LOAD_CANARY'
          $seen=$false
          $started=Get-Date
          $p=Start-Process -FilePath $firecast -PassThru
          Write-Host "FIRECAST_CANARY_PID=$($p.Id)"
          for($i=0;$i-lt60 -and -not $seen;$i++){
            Start-Sleep 1
            $root=[Windows.Automation.AutomationElement]::RootElement
            try{
              $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
              foreach($e in $all){
                try{
                  $n=[string]$e.Current.Name
                  if($n -like "*$marker*"){
                    Write-Host "CANARY_UI_ELEMENT=$n"
                    $seen=$true
                    break
                  }
                }catch{}
              }
            }catch{}
          }
          Write-Host "CANARY_EXECUTED=$seen"

          Write-Host '=== RECENT FIRECAST LOGS ==='
          foreach($rootPath in @((Join-Path $env:LOCALAPPDATA 'Firecast'),(Join-Path $env:APPDATA 'Firecast'))){
            if(Test-Path $rootPath){
              Get-ChildItem $rootPath -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object {$_.LastWriteTime -ge $started.AddMinutes(-1) -and $_.Length -lt 1048576} |
                ForEach-Object {
                  Write-Host "RECENT_FILE=$($_.FullName) SIZE=$($_.Length)"
                  if($_.Extension -match '^\.(txt|log|lua|xml)$'){
                    try{Get-Content $_.FullName -ErrorAction Stop | Select-Object -Last 120 | ForEach-Object{Write-Host "LOG=$_"}}catch{}
                  }
                }
            }
          }

          if(-not $p.HasExited){$p.CloseMainWindow()|Out-Null; try{Wait-Process -Id $p.Id -Timeout 8 -ErrorAction Stop}catch{Stop-Process -Id $p.Id -Force}}
          if(-not $seen){throw 'DIRECT_PLUGIN_FOLDER_CANARY_NOT_EXECUTED'}
          Write-Host 'DIRECT_PLUGIN_FOLDER_CANARY=PASS'
