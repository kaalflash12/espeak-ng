name: DIGIMON Firecast RPK Install Probe

on:
  push:
    branches: [digimon-ci-temp-20260830]
    paths: [.github/workflows/digimon-firecast-rpk-install-probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Initialize Firecast and require exact DigiTerion RPK install
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          winget install --id XP9B1DQSFR12KZ --source msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
          if($LASTEXITCODE-ne0){throw "Firecast Store install failed $LASTEXITCODE"}
          $firecast=Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe'
          if(-not(Test-Path $firecast)){throw 'Firecast.exe missing'}

          python -m pip install --disable-pip-version-check --quiet gdown
          $bundle=Join-Path $env:RUNNER_TEMP 'bundle.zip'
          python -m gdown 'https://drive.google.com/uc?id=1LWaYGuvoVLQ-TP3Yj0nqVprosbmYe_1b' -O $bundle
          $bundleSha=(Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if($bundleSha-ne '42094ab528b6f2139b0f2b09ef6741fb3a5640b5ba0f45041270c9e1f3d70bdb'){throw "Bundle SHA mismatch $bundleSha"}
          $runtime=Join-Path $env:RUNNER_TEMP 'bundle'
          Expand-Archive $bundle $runtime -Force
          $rpk=Join-Path $runtime 'DIGIMON_ERA_DA_DUALIDADE_FINAL.rpk'
          $rpkSha=(Get-FileHash $rpk -Algorithm SHA256).Hash.ToLowerInvariant()
          if($rpkSha-ne '3a3a61e642054f7a98cc7eefb01f0d43c8acf7c703e262b8bb55e8b63682bfef'){throw "RPK SHA mismatch $rpkSha"}
          Write-Host "FINAL_RPK_SHA256=$rpkSha"

          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Close-FirecastGracefully($p){
            if($null-eq$p -or $p.HasExited){return}
            try{$p.CloseMainWindow()|Out-Null}catch{}
            try{Wait-Process -Id $p.Id -Timeout 8 -ErrorAction Stop}catch{Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }
          function Invoke-ConfirmButtons {
            $root=[Windows.Automation.AutomationElement]::RootElement
            $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
            foreach($e in $all){
              try{
                $n=[string]$e.Current.Name; $ct=[string]$e.Current.ControlType.ProgrammaticName
                if($ct-eq'ControlType.Button' -and $n-match '^(Instalar|Install|Sim|Yes|OK|Confirmar|Confirm|Continuar|Continue)$'){
                  $pat=$e.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern)
                  if($pat){Write-Host "INVOKE_BUTTON=$n"; $pat.Invoke()}
                }
              }catch{}
            }
          }
          function Get-RpkModuleId([string]$path){
            $zip=[IO.Compression.ZipFile]::OpenRead($path)
            try{
              $entry=$zip.Entries|Where-Object{$_.FullName-eq'module.xml'}|Select-Object -First 1
              if($null-eq$entry){return ''}
              $sr=[IO.StreamReader]::new($entry.Open())
              try{$raw=$sr.ReadToEnd()}finally{$sr.Dispose()}
              $m=[regex]::Match($raw,'<id>\s*([^<]+?)\s*</id>','IgnoreCase')
              if($m.Success){return $m.Groups[1].Value.Trim()}
              return ''
            }finally{$zip.Dispose()}
          }
          function List-PluginIds([string]$tag){
            $plugins=Join-Path $env:APPDATA 'Firecast\Plugins'
            Write-Host "=== PLUGIN IDS $tag ==="
            $ids=@()
            if(-not(Test-Path $plugins)){Write-Host 'PLUGIN_DIR_MISSING'; return $ids}
            foreach($f in Get-ChildItem $plugins -File -Filter '*.rpk'){
              try{$mid=Get-RpkModuleId $f.FullName}catch{$mid=''; Write-Host "PLUGIN_READ_FAIL=$($f.FullName) ERROR=$($_.Exception.Message)"}
              Write-Host "PLUGIN_FILE=$($f.FullName) MODULE_ID=$mid SIZE=$($f.Length)"
              if($mid-ne''){$ids+=$mid}
            }
            return $ids
          }

          $p=Start-Process -FilePath $firecast -PassThru
          Start-Sleep 10
          Invoke-ConfirmButtons
          Start-Sleep 2
          Close-FirecastGracefully $p
          $beforeIds=@(List-PluginIds 'BEFORE')
          if($beforeIds -contains 'DigiTerionMon.EraDaDualidade'){throw 'DigiTerion unexpectedly present before install'}

          $p=Start-Process -FilePath $firecast -ArgumentList ('"'+$rpk+'"') -PassThru
          Write-Host "RPK_INSTALL_PROCESS_PID=$($p.Id)"
          for($i=0;$i-lt20;$i++){Start-Sleep 2; Invoke-ConfirmButtons}
          $afterIds=@(List-PluginIds 'AFTER')
          $installed=$afterIds -contains 'DigiTerionMon.EraDaDualidade'
          Write-Host "DIGITERION_MODULE_PRESENT=$installed"
          Close-FirecastGracefully $p
          if(-not $installed){throw 'EXACT_DIGITERION_RPK_NOT_INSTALLED'}
          Write-Host 'DIRECT_EXACT_RPK_INSTALL=PASS'
