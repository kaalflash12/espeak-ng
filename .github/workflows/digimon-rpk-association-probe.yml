name: DIGIMON Firecast RPK Association Probe
on:
  push:
    branches: [digimon-ci-temp-20260830]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Install Firecast and inspect RPK integration
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          winget install --id XP9B1DQSFR12KZ --source msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
          Write-Host "INSTALL_EXIT=$LASTEXITCODE"
          $firecast=Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe'
          Write-Host "FIRECAST=$firecast"
          Write-Host "FIRECAST_EXISTS=$(Test-Path -LiteralPath $firecast)"

          Write-Host '=== RPK REGISTRY KEYS ==='
          $roots=@(
            'Registry::HKEY_CLASSES_ROOT\.rpk',
            'HKCU:\Software\Classes\.rpk',
            'HKLM:\Software\Classes\.rpk'
          )
          foreach($k in $roots){
            Write-Host "KEY=$k EXISTS=$(Test-Path $k)"
            if(Test-Path $k){
              $item=Get-Item $k
              $default=$item.GetValue('')
              Write-Host "DEFAULT=$default"
              Get-ItemProperty $k | Format-List *
              if($default){
                foreach($base in @('Registry::HKEY_CLASSES_ROOT','HKCU:\Software\Classes','HKLM:\Software\Classes')){
                  $pk=Join-Path $base $default
                  if(Test-Path $pk){
                    Write-Host "PROGID_KEY=$pk"
                    Get-ChildItem $pk -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                      Write-Host "SUBKEY=$($_.Name) DEFAULT=$($_.GetValue(''))"
                    }
                  }
                }
              }
            }
          }

          Write-Host '=== FIRECAST APPLICATION REGISTRY ==='
          foreach($base in @(
            'Registry::HKEY_CLASSES_ROOT\Applications\Firecast.exe',
            'HKCU:\Software\Classes\Applications\Firecast.exe',
            'HKLM:\Software\Classes\Applications\Firecast.exe')){
            Write-Host "APPKEY=$base EXISTS=$(Test-Path $base)"
            if(Test-Path $base){
              Get-ChildItem $base -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "SUBKEY=$($_.Name) DEFAULT=$($_.GetValue(''))"
              }
            }
          }

          Write-Host '=== START MENU LINK TARGET ==='
          $lnk=Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Firecast\Firecast.lnk'
          Write-Host "LNK_EXISTS=$(Test-Path $lnk)"
          if(Test-Path $lnk){
            $w=New-Object -ComObject WScript.Shell
            $s=$w.CreateShortcut($lnk)
            Write-Host "LNK_TARGET=$($s.TargetPath)"
            Write-Host "LNK_ARGS=$($s.Arguments)"
            Write-Host "LNK_WORKDIR=$($s.WorkingDirectory)"
          }

          Write-Host '=== SHELL ASSOC COMMANDS ==='
          cmd /c "assoc .rpk"
          Write-Host "ASSOC_EXIT=$LASTEXITCODE"
          $assoc=(cmd /c "assoc .rpk" 2>$null)
          if($assoc -match '=([^=]+)$'){
            $ft=$Matches[1]
            Write-Host "RPK_FILETYPE=$ft"
            cmd /c "ftype $ft"
            Write-Host "FTYPE_EXIT=$LASTEXITCODE"
          }

          Write-Host '=== USER DATA CREATED BY START ==='
          $before=@{}
          foreach($root in @($env:LOCALAPPDATA,$env:APPDATA)){
            Get-ChildItem $root -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object {$before[$_.FullName]=$_.LastWriteTimeUtc.Ticks}
          }
          $t0=Get-Date
          $proc=Start-Process $firecast -PassThru
          Start-Sleep 12
          try{[void]$proc.CloseMainWindow();[void]$proc.WaitForExit(10000)}catch{}
          if(!$proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}
          foreach($root in @($env:LOCALAPPDATA,$env:APPDATA)){
            Get-ChildItem $root -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object {$_.LastWriteTime -ge $t0 -or -not $before.ContainsKey($_.FullName)} |
              Where-Object {$_.FullName -match 'Firecast|RRPG|plugin|rpk|module|vhd|ndb'} |
              Select-Object -First 300 FullName,Length,LastWriteTime |
              ForEach-Object {Write-Host "RUNTIME_FILE=$($_.FullName)|$($_.Length)|$($_.LastWriteTime.ToString('o'))"}
          }

          Write-Host '=== FIRECAST TOP LEVEL ==='
          Get-ChildItem (Split-Path $firecast -Parent) -Force -ErrorAction SilentlyContinue |
            ForEach-Object {Write-Host "INSTALL_ITEM=$($_.FullName)|$($_.Length)"}
          exit 0
