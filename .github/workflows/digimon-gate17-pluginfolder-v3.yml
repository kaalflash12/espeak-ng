name: DIGIMON Gate17 Plugin Folder V3
on:
  push:
    branches: [digimon-ci-temp-20260830]
  workflow_dispatch:

jobs:
  gate17:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Firecast and build hash-locked harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          winget install --id XP9B1DQSFR12KZ --source msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
          if($LASTEXITCODE-ne0){throw "Firecast install failed: $LASTEXITCODE"}
          $work=Join-Path $env:RUNNER_TEMP 'g17-v3'; New-Item -ItemType Directory -Force $work|Out-Null
          $bundle=Join-Path $work 'bundle.zip'
          python -m pip install --quiet gdown
          python -m gdown 'https://drive.google.com/uc?id=1LWaYGuvoVLQ-TP3Yj0nqVprosbmYe_1b' -O $bundle
          if($LASTEXITCODE-ne0){throw 'bundle download failed'}
          $bh=(Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant(); Write-Host "BUNDLE_SHA256=$bh"
          if($bh-ne'42094ab528b6f2139b0f2b09ef6741fb3a5640b5ba0f45041270c9e1f3d70bdb'){throw 'bundle hash mismatch'}
          $unpack=Join-Path $work 'bundle'; Expand-Archive $bundle $unpack -Force
          $final=Join-Path $unpack 'DIGIMON_ERA_DA_DUALIDADE_FINAL.rpk'
          $rh=(Get-FileHash $final -Algorithm SHA256).Hash.ToLowerInvariant(); Write-Host "FINAL_RPK_SHA256=$rh"
          if($rh-ne'3a3a61e642054f7a98cc7eefb01f0d43c8acf7c703e262b8bb55e8b63682bfef'){throw 'final RPK hash mismatch'}
          $zip=Join-Path $work 'final.zip'; Copy-Item $final $zip
          $tree=Join-Path $work 'tree'; Expand-Archive $zip $tree -Force
          Copy-Item '${{ github.workspace }}\ci\digimon-gate17\gate17_init_store.lua' (Join-Path $tree 'init.lua') -Force
          $hz=Join-Path $work 'harness.zip'; Compress-Archive -Path (Join-Path $tree '*') -DestinationPath $hz -CompressionLevel Optimal
          $harness=Join-Path $work 'DigiTerionMon.EraDaDualidade.rpk'; Move-Item $hz $harness -Force
          $plugins=Join-Path $env:APPDATA 'Firecast\Plugins'; New-Item -ItemType Directory -Force $plugins|Out-Null
          $dest=Join-Path $plugins 'DigiTerionMon.EraDaDualidade.rpk'; Copy-Item $harness $dest -Force
          Write-Host "HARNESS_DEST=$dest"
          Write-Host "HARNESS_SHA256=$((Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant())"
          "FINAL_RPK=$final"|Out-File $env:GITHUB_ENV -Append
          "PLUGIN_DEST=$dest"|Out-File $env:GITHUB_ENV -Append
      - name: Gate17 phase1 and fresh-process phase2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $firecast=Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe'
          $logDir=Join-Path $env:LOCALAPPDATA 'Firecast\LogErrors'
          function Get-Names([int]$processId){
            $root=[Windows.Automation.AutomationElement]::RootElement
            $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
            $out=New-Object System.Collections.Generic.List[string]
            foreach($e in $all){try{if($e.Current.ProcessId-eq$processId){$n=[string]$e.Current.Name;if(-not[string]::IsNullOrWhiteSpace($n)){$out.Add($n)}}}catch{}}
            return $out
          }
          function Click-OK([int]$processId){
            $root=[Windows.Automation.AutomationElement]::RootElement
            $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
            foreach($e in $all){try{if($e.Current.ProcessId-ne$processId){continue};$n=([string]$e.Current.Name).Trim();if($n-match'^(OK|Sim|Yes|Continuar|Continue)$'){$ip=$e.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern);if($ip){$ip.Invoke();Start-Sleep -Milliseconds 500;return $true}}}catch{}}
            return $false
          }
          function Wait-Marker([int]$processId,[string]$pattern,[int]$sec){
            $until=(Get-Date).AddSeconds($sec)
            while((Get-Date)-lt$until){
              if(!(Get-Process -Id $processId -ErrorAction SilentlyContinue)){return 'PROCESS_EXITED'}
              foreach($n in (Get-Names $processId)){if($n-match$pattern){return $n}}
              Start-Sleep 1
            }
            return 'TIMEOUT'
          }
          function Dump-Diagnostics([int]$processId,[string]$label){
            Write-Host "=== $label UI ==="
            Get-Names $processId|Select-Object -Unique|Select-Object -First 250|ForEach-Object{Write-Host "UI=$_"}
            foreach($fn in @('Firecast-debugLog.txt','Firecast-exe.txt')){ $p=Join-Path $logDir $fn; Write-Host "=== $fn ==="; if(Test-Path$p){Get-Content$p -Raw|Write-Host}else{Write-Host 'MISSING'} }
          }
          function Close-Gracefully([System.Diagnostics.Process]$proc){
            if($proc.HasExited){throw 'process exited before graceful close'}
            [void](Click-OK $proc.Id)
            try{[void]$proc.CloseMainWindow()}catch{}
            if(!$proc.WaitForExit(30000)){throw 'GRACEFUL_CLOSE_TIMEOUT'}
            Write-Host "GRACEFUL_CLOSE_EXIT=$($proc.ExitCode)"
          }
          Get-Process Firecast -ErrorAction SilentlyContinue|Stop-Process -Force
          Remove-Item (Join-Path $logDir 'Firecast-debugLog.txt') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $logDir 'Firecast-exe.txt') -Force -ErrorAction SilentlyContinue
          $p1=Start-Process $firecast -PassThru
          Write-Host "PHASE1_PROCESS_ID=$($p1.Id)"
          $m1=Wait-Marker $p1.Id 'GATE17_(PHASE1_PASS|PHASE1_FAIL|NDB_OPEN_FAIL)' 90
          Write-Host "GATE17_PHASE1_MARKER=$m1"
          if($m1-notmatch'GATE17_PHASE1_PASS'){Dump-Diagnostics $p1.Id 'PHASE1'; throw "Phase1 not PASS: $m1"}
          [void](Click-OK $p1.Id); Start-Sleep 1
          Close-Gracefully $p1
          Write-Host 'GATE17_PHASE1_GRACEFUL_CLOSE=1'
          Start-Sleep 3
          $p2=Start-Process $firecast -PassThru
          Write-Host "PHASE2_PROCESS_ID=$($p2.Id)"
          $m2=Wait-Marker $p2.Id 'GATE17_(PHASE2_PASS|PHASE2_FAIL|NDB_OPEN_FAIL)' 90
          Write-Host "GATE17_PHASE2_MARKER=$m2"
          if($m2-notmatch'GATE17_PHASE2_PASS'){Dump-Diagnostics $p2.Id 'PHASE2'; throw "Phase2 not PASS: $m2"}
          [void](Click-OK $p2.Id); Start-Sleep 1
          Close-Gracefully $p2
          Write-Host 'GATE17_PHASE2_GRACEFUL_CLOSE=1'
          Write-Host 'GATE17=PASS'
      - name: Restore exact final RPK and Gate18 smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $firecast=Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe'
          Get-Process Firecast -ErrorAction SilentlyContinue|Stop-Process -Force
          Copy-Item $env:FINAL_RPK $env:PLUGIN_DEST -Force
          $sha=(Get-FileHash $env:PLUGIN_DEST -Algorithm SHA256).Hash.ToLowerInvariant(); Write-Host "RESTORED_RPK_SHA256=$sha"
          if($sha-ne'3a3a61e642054f7a98cc7eefb01f0d43c8acf7c703e262b8bb55e8b63682bfef'){throw 'restore hash mismatch'}
          $p=Start-Process $firecast -PassThru; Start-Sleep 25
          if($p.HasExited){throw 'Firecast exited after exact final restore'}
          $root=[Windows.Automation.AutomationElement]::RootElement
          $all=$root.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
          foreach($e in $all){try{if($e.Current.ProcessId-eq$p.Id -and ([string]$e.Current.Name)-match'(?i)^Error$|runtime error|stack traceback'){throw "runtime error UI: $($e.Current.Name)"}}catch{if($_.Exception.Message-match'runtime error UI'){throw}}}
          Write-Host 'GATE18_FINAL_ERROR=0'
          Write-Host 'GATE18_FINAL_PROCESS_ALIVE=1'
          Write-Host 'GATE18=PASS'
          Write-Host 'OVERALL_18_OF_18=PASS'
          try{[void]$p.CloseMainWindow();[void]$p.WaitForExit(15000)}catch{}
