name: DIGIMON Gate17 Harness Init Probe
on:
  push:
    branches: [digimon-fetch-matrix-20260830]
    paths: [.github/workflows/digimon-gate17-harness-init-probe.yml]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Install Firecast and exact final RPK
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          winget install --id XP9B1DQSFR12KZ --source msstore --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
          if($LASTEXITCODE-ne 0){throw "FIRECAST_INSTALL_EXIT=$LASTEXITCODE"}
          py -m pip install --disable-pip-version-check --quiet gdown
          $z=Join-Path $env:RUNNER_TEMP 'bundle.zip'
          py -m gdown 'https://drive.google.com/uc?id=1LWaYGuvoVLQ-TP3Yj0nqVprosbmYe_1b' -O $z
          if($LASTEXITCODE-ne 0){throw 'GDOWN_FAIL'}
          $bsha=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant()
          if($bsha-ne'42094ab528b6f2139b0f2b09ef6741fb3a5640b5ba0f45041270c9e1f3d70bdb'){throw "BUNDLE_SHA=$bsha"}
          $d=Join-Path $env:RUNNER_TEMP 'bundle';Expand-Archive $z $d -Force
          $rpk=Join-Path $d 'DIGIMON_ERA_DA_DUALIDADE_FINAL.rpk'
          $rsha=(Get-FileHash $rpk -Algorithm SHA256).Hash.ToLowerInvariant()
          if($rsha-ne'3a3a61e642054f7a98cc7eefb01f0d43c8acf7c703e262b8bb55e8b63682bfef'){throw "RPK_SHA=$rsha"}
          "RPK=$rpk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FIRECAST=$(Join-Path $env:LOCALAPPDATA 'Firecast\Firecast.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PLUGIN=$(Join-Path $env:APPDATA 'Firecast\Plugins\digiterionmon.eradadualidade.rpk')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install exact RPK through custom modal
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient;Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;using System.Runtime.InteropServices;
          public static class MouseG17P{[DllImport("user32.dll")]public static extern bool SetCursorPos(int X,int Y);[DllImport("user32.dll")]public static extern void mouse_event(uint f,uint x,uint y,uint d,UIntPtr e);public static void Click(int x,int y){SetCursorPos(x,y);System.Threading.Thread.Sleep(100);mouse_event(2,0,0,0,UIntPtr.Zero);System.Threading.Thread.Sleep(80);mouse_event(4,0,0,0,UIntPtr.Zero);}}
          '@
          function FW{$root=[Windows.Automation.AutomationElement]::RootElement;$wins=$root.FindAll([Windows.Automation.TreeScope]::Children,[Windows.Automation.Condition]::TrueCondition);foreach($w in $wins){try{if(([string]$w.Current.Name)-match'^Firecast'){return $w}}catch{}}}
          $p=Start-Process $env:FIRECAST -ArgumentList @($env:RPK) -PassThru
          $w=$null;for($i=0;$i-lt30-and$null-eq$w;$i++){Start-Sleep 1;$w=FW};if($null-eq$w){throw'NO_WINDOW'}
          Start-Sleep 4;$r=$w.Current.BoundingRectangle;$x=[int]($r.Left+$r.Width*.489);$y=[int]($r.Top+$r.Height*.626);[MouseG17P]::Click($x,$y);Start-Sleep 5
          if(-not(Test-Path $env:PLUGIN)){throw 'PLUGIN_NOT_INSTALLED'}
          $ish=(Get-FileHash $env:PLUGIN -Algorithm SHA256).Hash.ToLowerInvariant();Write-Host "INSTALLED_PLUGIN_SHA=$ish"
          if($ish-ne'3a3a61e642054f7a98cc7eefb01f0d43c8acf7c703e262b8bb55e8b63682bfef'){throw "INSTALLED_SHA=$ish"}
          [void]$p.CloseMainWindow();if(-not$p.WaitForExit(15000)){Stop-Process -Id $p.Id -Force}
          Write-Host 'FINAL_RPK_INSTALLED_EXACT=1'
      - name: Replace installed init with Gate17 probe and launch fresh process
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'g17-init-probe';New-Item -ItemType Directory -Force $out|Out-Null
          Copy-Item $env:PLUGIN (Join-Path $out 'final-installed.rpk') -Force
          $work=Join-Path $env:RUNNER_TEMP 'rpkwork';New-Item -ItemType Directory -Force $work|Out-Null
          Copy-Item $env:PLUGIN (Join-Path $work 'base.zip') -Force;Expand-Archive (Join-Path $work 'base.zip') (Join-Path $work 'x') -Force
          @'
          print("GATE17_HARNESS_INIT_PROBE_PRINT")
          showMessage("GATE17_HARNESS_INIT_PROBE")
          '@ | Set-Content (Join-Path $work 'x\init.lua') -Encoding utf8NoBOM
          Remove-Item (Join-Path $work 'probe.zip') -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $work 'x\*') -DestinationPath (Join-Path $work 'probe.zip') -CompressionLevel Optimal
          Copy-Item (Join-Path $work 'probe.zip') $env:PLUGIN -Force
          $h=(Get-FileHash $env:PLUGIN -Algorithm SHA256).Hash.ToLowerInvariant();Write-Host "HARNESS_RPK_SHA=$h SIZE=$((Get-Item $env:PLUGIN).Length)"
          Add-Type -AssemblyName System.Drawing;Add-Type -AssemblyName System.Windows.Forms
          function Shot($n){$b=[Windows.Forms.Screen]::PrimaryScreen.Bounds;$bmp=New-Object Drawing.Bitmap $b.Width,$b.Height;$g=[Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($b.Location,[Drawing.Point]::Empty,$b.Size);$bmp.Save((Join-Path $out $n));$g.Dispose();$bmp.Dispose()}
          $p2=Start-Process $env:FIRECAST -PassThru
          Write-Host "FRESH_FIRECAST_PID=$($p2.Id)"
          Start-Sleep 12;Shot 'fresh-after-12s.png'
          $logs=Join-Path $env:LOCALAPPDATA 'Firecast\LogErrors'
          if(Test-Path $logs){Copy-Item $logs (Join-Path $out 'LogErrors') -Recurse -Force}
          Get-ChildItem (Join-Path $env:APPDATA 'Firecast') -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.LastWriteTime -gt (Get-Date).AddMinutes(-3)} | Select FullName,Length,LastWriteTime | Format-Table -AutoSize
          if($p2.HasExited){Write-Host "FRESH_FIRECAST_EXITED=$($p2.ExitCode)"}else{Write-Host 'FRESH_FIRECAST_ALIVE=1';[void]$p2.CloseMainWindow();if(-not$p2.WaitForExit(10000)){Stop-Process -Id $p2.Id -Force}}
          Copy-Item (Join-Path $out 'final-installed.rpk') $env:PLUGIN -Force
          $rest=(Get-FileHash $env:PLUGIN -Algorithm SHA256).Hash.ToLowerInvariant();Write-Host "RESTORED_SHA=$rest"
          if($rest-ne'3a3a61e642054f7a98cc7eefb01f0d43c8acf7c703e262b8bb55e8b63682bfef'){throw 'RESTORE_SHA_FAIL'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digimon-gate17-harness-init-probe
          path: ${{ runner.temp }}/g17-init-probe/**
          if-no-files-found: warn
